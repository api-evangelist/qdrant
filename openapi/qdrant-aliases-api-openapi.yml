openapi: 3.2.0
info:
  title: Qdrant Aliases API
  description: API description for Qdrant vector search engine.
  contact:
    email: andrey@vasnetsov.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: master
servers:
- url: '{protocol}://{hostname}:{port}'
  variables:
    protocol:
      enum:
      - http
      - https
      default: http
    hostname:
      default: localhost
    port:
      default: '6333'
security:
- api-key: []
- bearerAuth: []
- {}
tags:
- name: Aliases
  description: Additional names for existing collections.
paths:
  /collections/aliases:
    post:
      tags:
      - Aliases
      summary: Update aliases of the collections
      operationId: update_aliases
      requestBody:
        description: Alias update operations
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAliasesOperation'
      parameters:
      - name: timeout
        in: query
        description: 'Wait for operation commit timeout in seconds.

          If timeout is reached - request will return with service error.

          '
        schema:
          type: integer
      responses:
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        4XX:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  usage:
                    default: null
                    anyOf:
                    - $ref: '#/components/schemas/Usage'
                    - {}
                  time:
                    type: number
                    format: float
                    description: Time spent to process this request
                    example: 0.002
                  status:
                    type: string
                    example: ok
                  result:
                    type: boolean
  /collections/{collection_name}/aliases:
    get:
      tags:
      - Aliases
      summary: List aliases for collection
      description: Get list of all aliases for a collection
      operationId: get_collection_aliases
      parameters:
      - name: collection_name
        in: path
        description: Name of the collection
        required: true
        schema:
          type: string
      responses:
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        4XX:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  usage:
                    default: null
                    anyOf:
                    - $ref: '#/components/schemas/Usage'
                    - {}
                  time:
                    type: number
                    format: float
                    description: Time spent to process this request
                    example: 0.002
                  status:
                    type: string
                    example: ok
                  result:
                    $ref: '#/components/schemas/CollectionsAliasesResponse'
  /aliases:
    get:
      tags:
      - Aliases
      summary: List collections aliases
      description: Get list of all existing collections aliases
      operationId: get_collections_aliases
      responses:
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        4XX:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  usage:
                    default: null
                    anyOf:
                    - $ref: '#/components/schemas/Usage'
                    - {}
                  time:
                    type: number
                    format: float
                    description: Time spent to process this request
                    example: 0.002
                  status:
                    type: string
                    example: ok
                  result:
                    $ref: '#/components/schemas/CollectionsAliasesResponse'
components:
  schemas:
    CreateAliasOperation:
      type: object
      required:
      - create_alias
      properties:
        create_alias:
          $ref: '#/components/schemas/CreateAlias'
    DeleteAliasOperation:
      description: Delete alias if exists
      type: object
      required:
      - delete_alias
      properties:
        delete_alias:
          $ref: '#/components/schemas/DeleteAlias'
    CreateAlias:
      description: Create alternative name for a collection. Collection will be available under both names for search, retrieve,
      type: object
      required:
      - alias_name
      - collection_name
      properties:
        collection_name:
          type: string
        alias_name:
          type: string
    ChangeAliasesOperation:
      description: Operation for performing changes of collection aliases. Alias changes are atomic, meaning that no collection modifications can happen between alias operations.
      type: object
      required:
      - actions
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AliasOperations'
    AliasOperations:
      description: Group of all the possible operations related to collection aliases
      anyOf:
      - $ref: '#/components/schemas/CreateAliasOperation'
      - $ref: '#/components/schemas/DeleteAliasOperation'
      - $ref: '#/components/schemas/RenameAliasOperation'
    Usage:
      description: Usage of the hardware resources, spent to process the request
      type: object
      properties:
        hardware:
          anyOf:
          - $ref: '#/components/schemas/HardwareUsage'
          - {}
        inference:
          anyOf:
          - $ref: '#/components/schemas/InferenceUsage'
          - {}
    AliasDescription:
      type: object
      required:
      - alias_name
      - collection_name
      properties:
        alias_name:
          type: string
        collection_name:
          type: string
      example:
        alias_name: blogs-title
        collection_name: arivx-title
    ErrorResponse:
      type: object
      properties:
        time:
          type: number
          format: float
          description: Time spent to process this request
        status:
          type: object
          properties:
            error:
              type: string
              description: Description of the occurred error.
        result:
          type:
          - object
          - 'null'
    InferenceUsage:
      type: object
      required:
      - models
      properties:
        models:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ModelUsage'
    RenameAliasOperation:
      description: Change alias to a new one
      type: object
      required:
      - rename_alias
      properties:
        rename_alias:
          $ref: '#/components/schemas/RenameAlias'
    CollectionsAliasesResponse:
      type: object
      required:
      - aliases
      properties:
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/AliasDescription'
    HardwareUsage:
      description: Usage of the hardware resources, spent to process the request
      type: object
      required:
      - cpu
      - payload_index_io_read
      - payload_index_io_write
      - payload_io_read
      - payload_io_write
      - vector_io_read
      - vector_io_write
      properties:
        cpu:
          type: integer
          format: uint
          minimum: 0
        payload_io_read:
          type: integer
          format: uint
          minimum: 0
        payload_io_write:
          type: integer
          format: uint
          minimum: 0
        payload_index_io_read:
          type: integer
          format: uint
          minimum: 0
        payload_index_io_write:
          type: integer
          format: uint
          minimum: 0
        vector_io_read:
          type: integer
          format: uint
          minimum: 0
        vector_io_write:
          type: integer
          format: uint
          minimum: 0
    RenameAlias:
      description: Change alias to a new one
      type: object
      required:
      - new_alias_name
      - old_alias_name
      properties:
        old_alias_name:
          type: string
        new_alias_name:
          type: string
    ModelUsage:
      type: object
      required:
      - tokens
      properties:
        tokens:
          type: integer
          format: uint64
          minimum: 0
    DeleteAlias:
      description: Delete alias if exists
      type: object
      required:
      - alias_name
      properties:
        alias_name:
          type: string
  securitySchemes:
    api-key:
      type: apiKey
      in: header
      name: api-key
      description: Authorization key, either read-write or read-only
    bearerAuth:
      type: http
      scheme: bearer
externalDocs:
  description: Find out more about Qdrant applications and demo
  url: https://qdrant.tech/documentation/
