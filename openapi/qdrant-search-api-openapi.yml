        weights:
          description: Weights for each prefetch source. Higher weight gives more influence on the final ranking. If not specified, all prefetches are weighted equally. The number of weights should match the number of prefetches.
          type: array
          items:
            type: number
            format: float
          nullable: true
    NamedVectorStruct:
      description: 'Vector data separator for named and unnamed modes Unnamed mode:


        { "vector": [1.0, 2.0, 3.0] }


        or named mode:


        { "vector": { "vector": [1.0, 2.0, 3.0], "name": "image-embeddings" } }'
      anyOf:
      - type: array
