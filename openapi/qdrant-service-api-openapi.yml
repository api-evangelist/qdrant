    VectorStorageType:
      description: Storage types for vectors
      oneOf:
      - description: 'Storage in memory (RAM)


          Will be very fast at the cost of consuming a lot of memory.'
        type: string
        enum:
        - Memory
      - description: 'Storage in mmap file, not appendable


          Search performance is defined by disk speed and the fraction of vectors that fit in memory.'
        type: string
        enum:
        - Mmap
      - description: 'Storage in chunked mmap files, appendable


          Search performance is defined by disk speed and the fraction of vectors that fit in memory.'
        type: string
        enum:
        - ChunkedMmap
      - description: 'Same as `ChunkedMmap`, but vectors are forced to be locked in RAM In this way we avoid cold requests to disk, but risk to run out of memory


          Designed as a replacement for `Memory`, which doesn''t depend on RocksDB'
        type: string
        enum:
        - InRamChunkedMmap
      - description: Storage in a single mmap file, not appendable Pre-fetched into RAM on load
