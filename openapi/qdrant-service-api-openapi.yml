      - kazakh
      - nepali
      - norwegian
      - portuguese
      - romanian
      - russian
      - slovene
      - spanish
      - swedish
      - tajik
      - turkish
    ConsensusConfigTelemetry:
      type: object
      required:
      - bootstrap_timeout_sec
      - max_message_queue_size
      - tick_period_ms
      properties:
        max_message_queue_size:
          type: integer
          format: uint
          minimum: 0
        tick_period_ms:
          type: integer
          format: uint64
          minimum: 0
        bootstrap_timeout_sec:
          type: integer
          format: uint64
          minimum: 0
    SparseVectorParams:
      description: Params of single sparse vector data storage
      type: object
      properties:
        index:
          description: Custom params for index. If none - values from collection configuration are used.
          anyOf:
          - $ref: '#/components/schemas/SparseIndexParams'
          - nullable: true
        modifier:
          description: 'Configures addition value modifications for sparse vectors. Default: none'
          anyOf:
          - $ref: '#/components/schemas/Modifier'
          - nullable: true
  securitySchemes:
    api-key:
      type: apiKey
      in: header
      name: api-key
      description: Authorization key, either read-write or read-only
    bearerAuth:
      type: http
      scheme: bearer
