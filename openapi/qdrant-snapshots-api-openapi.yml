        required: true
        schema:
          type: string
      - name: shard_id
        in: path
        description: Id of the shard
        required: true
        schema:
          type: integer
      - name: wait
        in: query
        description: If true, wait for changes to actually happen. If false - let changes happen in background. Default is true.
        required: false
        schema:
          type: boolean
      responses:
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        4XX:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  time:
                    type: number
                    format: float
                    description: Time spent to process this request
                    example: 0.002
                  status:
                    type: string
                    example: ok
                  result:
                    $ref: '#/components/schemas/SnapshotDescription'
        '202':
          description: operation is accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  time:
                    type: number
                    format: float
                    description: Time spent to process this request
                  status:
                    type: string
  /collections/{collection_name}/shards/{shard_id}/snapshots/{snapshot_name}:
    delete:
      tags:
      - Snapshots
      summary: Delete shard snapshot
      description: Delete snapshot of a shard for a collection
      operationId: delete_shard_snapshot
      parameters:
      - name: collection_name
        in: path
        description: Name of the collection for which to delete a snapshot
        required: true
        schema:
          type: string
      - name: shard_id
        in: path
        description: Id of the shard
        required: true
        schema:
          type: integer
      - name: snapshot_name
        in: path
        description: Name of the snapshot to delete
        required: true
        schema:
          type: string
      - name: wait
        in: query
        description: If true, wait for changes to actually happen. If false - let changes happen in background. Default is true.
        required: false
        schema:
          type: boolean
      responses:
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        4XX:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  time:
                    type: number
                    format: float
                    description: Time spent to process this request
                    example: 0.002
                  status:
                    type: string
                    example: ok
                  result:
                    type: boolean
        '202':
          description: operation is accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  time:
                    type: number
                    format: float
                    description: Time spent to process this request
                  status:
                    type: string
    get:
      tags:
      - Snapshots
      summary: Download collection snapshot
      description: Download specified snapshot of a shard from a collection as a file
      operationId: get_shard_snapshot
      parameters:
      - name: collection_name
        in: path
        description: Name of the collection
        required: true
        schema:
          type: string
      - name: shard_id
        in: path
        description: Id of the shard
        required: true
        schema:
          type: integer
      - name: snapshot_name
        in: path
        description: Name of the snapshot to download
        required: true
        schema:
          type: string
      responses:
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        4XX:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Snapshot file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
components:
  schemas:
    Usage:
      description: Usage of the hardware resources, spent to process the request
      type: object
      properties:
        hardware:
          anyOf:
          - $ref: '#/components/schemas/HardwareUsage'
          - {}
        inference:
          anyOf:
          - $ref: '#/components/schemas/InferenceUsage'
          - {}
    ShardSnapshotRecover:
      type: object
      required:
      - location
      properties:
        location:
          $ref: '#/components/schemas/ShardSnapshotLocation'
        priority:
          default: null
          anyOf:
          - $ref: '#/components/schemas/SnapshotPriority'
          - {}
        checksum:
          description: Optional SHA256 checksum to verify snapshot integrity before recovery.
          default: null
          type:
          - string
          - 'null'
        api_key:
          description: Optional API key used when fetching the snapshot from a remote URL.
          default: null
          type:
          - string
          - 'null'
    ErrorResponse:
      type: object
      properties:
        time:
          type: number
          format: float
          description: Time spent to process this request
        status:
          type: object
          properties:
            error:
              type: string
              description: Description of the occurred error.
        result:
          type:
          - object
          - 'null'
    InferenceUsage:
      type: object
      required:
      - models
      properties:
        models:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ModelUsage'
    SnapshotRecover:
      type: object
      required:
      - location
      properties:
        location:
          description: 'Examples: - URL `http://localhost:8080/collections/my_collection/snapshots/my_snapshot` - Local path `file:///qdrant/snapshots/test_collection-2022-08-04-10-49-10.snapshot`'
          type: string
          format: uri
        priority:
          description: Defines which data should be used as a source of truth if there are other replicas in the cluster. If set to `Snapshot`, the snapshot will be used as a source of truth, and the current state will be overwritten. If set to `Replica`, the current state will be used as a source of truth, and after recovery if will be synchronized with the snapshot.
          default: null
          anyOf:
          - $ref: '#/components/schemas/SnapshotPriority'
          - {}
        checksum:
          description: Optional SHA256 checksum to verify snapshot integrity before recovery.
          default: null
          type:
          - string
          - 'null'
        api_key:
          description: Optional API key used when fetching the snapshot from a remote URL.
          default: null
          type:
          - string
          - 'null'
    SnapshotDescription:
      type: object
      required:
      - name
      - size
      properties:
        name:
          type: string
        creation_time:
          type:
          - string
          - 'null'
          format: partial-date-time
        size:
          type: integer
          format: uint64
          minimum: 0
        checksum:
          type:
          - string
          - 'null'
      example:
        name: my-collection-3766212330831337-2024-07-22-08-31-55.snapshot
        creation_time: '2022-08-04T10:49:10'
        size: 1000000
        checksum: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0
    HardwareUsage:
      description: Usage of the hardware resources, spent to process the request
      type: object
      required:
      - cpu
      - payload_index_io_read
      - payload_index_io_write
      - payload_io_read
      - payload_io_write
      - vector_io_read
      - vector_io_write
      properties:
        cpu:
          type: integer
          format: uint
          minimum: 0
        payload_io_read:
          type: integer
          format: uint
          minimum: 0
        payload_io_write:
          type: integer
          format: uint
          minimum: 0
        payload_index_io_read:
          type: integer
          format: uint
          minimum: 0
        payload_index_io_write:
          type: integer
          format: uint
          minimum: 0
        vector_io_read:
          type: integer
          format: uint
          minimum: 0
        vector_io_write:
          type: integer
          format: uint
          minimum: 0
    SnapshotPriority:
      description: 'Defines source of truth for snapshot recovery:


        `NoSync` means - restore snapshot without *any* additional synchronization. `Snapshot` means - prefer snapshot data over the current state. `Replica` means - prefer existing data over the snapshot.'
      type: string
      enum:
      - no_sync
      - snapshot
      - replica
    ModelUsage:
      type: object
      required:
      - tokens
      properties:
        tokens:
          type: integer
          format: uint64
          minimum: 0
    ShardSnapshotLocation:
      anyOf:
      - type: string
        format: uri
      - type: string
  securitySchemes:
    api-key:
      type: apiKey
      in: header
      name: api-key
      description: Authorization key, either read-write or read-only
    bearerAuth:
      type: http
      scheme: bearer
externalDocs:
  description: Find out more about Qdrant applications and demo
  url: https://qdrant.tech/documentation/
