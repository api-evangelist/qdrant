                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Snapshot file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /collections/{collection_name}/shards/{shard_id}/snapshot:
    get:
      tags:
      - Snapshots
      summary: Download shard snapshot
      description: Stream the current state of a shard as a snapshot file
      operationId: stream_shard_snapshot
      parameters:
      - name: collection_name
        in: path
        description: Name of the collection
        required: true
        schema:
          type: string
      - name: shard_id
        in: path
        description: Id of the shard
        required: true
        schema:
          type: integer
      responses:
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        4XX:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Snapshot file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /collections/{collection_name}/shards/{shard_id}/snapshots/upload:
    post:
      tags:
      - Snapshots
      summary: Recover shard from an uploaded snapshot
      description: Recover shard of a local collection from an uploaded snapshot. This will overwrite any data, stored on this node, for the collection shard.
      operationId: recover_shard_from_uploaded_snapshot
      parameters:
      - name: collection_name
        in: path
        description: Name of the collection
        required: true
        schema:
          type: string
      - name: shard_id
        in: path
        description: Id of the shard to recover
        required: true
        schema:
          type: integer
      - name: wait
        in: query
        description: If true, wait for changes to actually happen. If false - let changes happen in background. Default is true.
        required: false
        schema:
          type: boolean
      - name: priority
        in: query
        description: Defines source of truth for snapshot recovery
        required: false
        schema:
          $ref: '#/components/schemas/SnapshotPriority'
      - name: checksum
        in: query
        description: Optional SHA256 checksum to verify snapshot integrity before recovery.
        required: false
        schema:
          type: string
      requestBody:
        description: Snapshot to recover from
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                snapshot:
                  type: string
                  format: binary
      responses:
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        4XX:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  time:
                    type: number
                    format: float
                    description: Time spent to process this request
                    example: 0.002
                  status:
                    type: string
                    example: ok
                  result:
                    type: boolean
        '202':
          description: operation is accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  time:
                    type: number
                    format: float
                    description: Time spent to process this request
                  status:
                    type: string
  /collections/{collection_name}/shards/{shard_id}/snapshots/recover:
    put:
      tags:
      - Snapshots
      summary: Recover from a snapshot
      description: Recover shard of a local collection data from a snapshot. This will overwrite any data, stored in this shard, for the collection.
      operationId: recover_shard_from_snapshot
      parameters:
      - name: collection_name
        in: path
        description: Name of the collection
        required: true
        schema:
          type: string
      - name: shard_id
        in: path
        description: Id of the shard to recover
        required: true
        schema:
          type: integer
      - name: wait
        in: query
        description: If true, wait for changes to actually happen. If false - let changes happen in background. Default is true.
        required: false
        schema:
          type: boolean
      requestBody:
        description: Snapshot to recover from
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShardSnapshotRecover'
      responses:
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        4XX:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  time:
                    type: number
                    format: float
                    description: Time spent to process this request
                    example: 0.002
                  status:
                    type: string
